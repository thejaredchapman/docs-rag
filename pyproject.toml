[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-rag-mcp"
dynamic = ["version"]
description = "Documentation-search RAG with source citations -- FAISS retrieval over any LLM provider via litellm, exposed as an MCP server and CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jared Chapman" }]
dependencies = [
  "litellm>=1.55",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "fastmcp>=2.0",
  "pdfplumber>=0.11",
]

[project.urls]
Repository = "https://github.com/thejaredchapman/docs-rag"

[project.scripts]
docs-rag-mcp = "docs_rag.mcp_server:main"
docs-rag = "docs_rag.main:main"
docs-rag-ingest = "docs_rag.ingest:build_index"

[tool.setuptools]
packages = ["docs_rag"]

[tool.setuptools.dynamic]
version = { attr = "docs_rag.__version__" }
